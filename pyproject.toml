[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Automated multi-market trading bot (Forex + Crypto) via MetaTrader 5"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "ta>=0.11",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "xgboost>=2.0",
    "lightgbm>=4.1",
    "shap>=0.44",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "rpyc>=6.0",   # Linux/Wine MT5 bridge client
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "black>=23.0",
    "ruff>=0.1",
]
# Windows / Wine: pip install -e ".[mt5]"
mt5 = [
    "MetaTrader5>=5.0.45",
]
# Linux bridge via mt5linux (requires Wine + MT5 terminal):
# pip install -e ".[mt5linux]"
mt5linux = [
    "mt5linux>=0.0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.setuptools.packages.find]
# Discover all packages (multiple top-level packages in flat layout)
where = ["."]
include = ["analysis*", "backtest*", "config*", "data*", "execution*", "live*", "ml*", "risk*", "signals*"]
exclude = ["tests*", "logs*", "prompts*"]
